<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KPITALIST — Suivi des recommandations</title>
<style>
  :root{
    --bg:#08090c;
    --card:rgba(255,255,255,.045);
    --card-hover:rgba(255,255,255,.07);
    --stroke:rgba(255,255,255,.09);
    --txt:#f2f3f7;
    --txt2:#9a9fac;
    --txt3:#5c6170;
    --up:#30d158;
    --down:#ff453a;
    --ap:#0a84ff;      /* Alpha Pick */
    --sa:#bf5af2;      /* Stock Advisor */
    --vl:#64d2ff;      /* Value Line */
    --r-lg:26px; --r-md:20px; --r-sm:13px;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--txt);font-family:var(--sans);
    min-height:100vh;overflow-x:hidden;
  }
  /* halos de fond */
  .glow{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;z-index:0;opacity:.55;transition:background 1s}
  .glow.g1{width:640px;height:640px;top:-260px;left:-160px;background:radial-gradient(circle,rgba(10,132,255,.20),transparent 70%)}
  .glow.g2{width:560px;height:560px;top:20%;right:-220px;background:radial-gradient(circle,rgba(191,90,242,.13),transparent 70%)}
  .glow.g3{width:500px;height:500px;bottom:-200px;left:30%;background:radial-gradient(circle,rgba(48,209,88,.08),transparent 70%)}

  .wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 22px 90px}

  /* ─── Header ─── */
  header{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 4px;margin:0 -4px 8px;
    background:linear-gradient(to bottom,rgba(8,9,12,.88),rgba(8,9,12,.55) 70%,transparent);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  }
  .logo{display:flex;align-items:baseline;gap:11px}
  .logo h1{
    font-size:22px;font-weight:800;letter-spacing:.14em;
    background:linear-gradient(120deg,#fff 20%,#8ec5ff 55%,#c48aff 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .logo span{font-size:12px;color:var(--txt3);font-weight:500;letter-spacing:.02em}
  .updated{font-size:12px;color:var(--txt3);text-align:right;line-height:1.5}
  .updated b{color:var(--txt2);font-weight:600}

  /* ─── Stats hero ─── */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0 26px}
  .stat{
    background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-md);
    padding:20px 22px;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    animation:rise .6s cubic-bezier(.2,.8,.25,1) backwards;
  }
  .stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}
  .stat .lbl{font-size:12px;color:var(--txt2);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
  .stat .val{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .sub{font-size:12px;color:var(--txt3);margin-top:5px}
  .stat .val.up{color:var(--up)} .stat .val.down{color:var(--down)}

  /* ─── Contrôles ─── */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:24px}
  .seg{
    display:flex;background:var(--card);border:1px solid var(--stroke);border-radius:100px;padding:4px;
    backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  }
  .seg button{
    border:0;background:transparent;color:var(--txt2);font-family:inherit;
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:100px;cursor:pointer;
    transition:all .25s;white-space:nowrap;
  }
  .seg button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.3)}
  .seg button.on.c-ap{background:linear-gradient(135deg,rgba(10,132,255,.85),rgba(10,132,255,.55));}
  .seg button.on.c-sa{background:linear-gradient(135deg,rgba(191,90,242,.85),rgba(191,90,242,.5));}
  .seg button.on.c-vl{background:linear-gradient(135deg,rgba(100,210,255,.8),rgba(100,210,255,.45));color:#04222e}
  .search{
    flex:1;min-width:180px;display:flex;align-items:center;gap:9px;
    background:var(--card);border:1px solid var(--stroke);border-radius:100px;padding:10px 18px;
    backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transition:border .25s;
  }
  .search:focus-within{border-color:rgba(10,132,255,.55)}
  .search svg{flex:none;opacity:.4}
  .search input{flex:1;border:0;background:transparent;outline:0;color:var(--txt);font-family:inherit;font-size:14px}
  .search input::placeholder{color:var(--txt3)}
  select.sort{
    appearance:none;-webkit-appearance:none;
    background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%239a9fac" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>') no-repeat right 16px center;
    border:1px solid var(--stroke);border-radius:100px;color:var(--txt);
    font-family:inherit;font-size:13px;font-weight:600;padding:10px 38px 10px 18px;cursor:pointer;outline:0;
    backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  }
  select.sort option{background:#15171d;color:var(--txt)}

  /* ─── Grille de cartes ─── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{
    position:relative;background:var(--card);border:1px solid var(--stroke);border-radius:var(--r-lg);
    padding:20px 20px 16px;cursor:pointer;overflow:hidden;
    backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    transition:transform .35s cubic-bezier(.2,.8,.25,1),background .3s,border-color .3s,box-shadow .35s;
    animation:rise .55s cubic-bezier(.2,.8,.25,1) backwards;
  }
  .card:hover{transform:translateY(-4px) scale(1.012);background:var(--card-hover);box-shadow:0 22px 44px -18px rgba(0,0,0,.65)}
  .card::before{ /* liseré teinté portefeuille */
    content:"";position:absolute;inset:0 0 auto 0;height:2px;opacity:.8;
    background:linear-gradient(90deg,transparent,var(--tint,#666),transparent);
  }
  .card.p-ap{--tint:var(--ap)} .card.p-sa{--tint:var(--sa)} .card.p-vl{--tint:var(--vl)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .tkr{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--tint,#aaa)}
  .cname{font-size:16.5px;font-weight:700;letter-spacing:-.01em;margin-top:3px;line-height:1.25}
  .pf-badge{
    flex:none;font-size:10px;font-weight:700;letter-spacing:.07em;padding:5px 10px;border-radius:100px;
    color:var(--tint);background:color-mix(in srgb,var(--tint) 13%,transparent);
    border:1px solid color-mix(in srgb,var(--tint) 30%,transparent);white-space:nowrap;
  }
  .card .spark{display:block;width:100%;height:56px;margin:14px 0 10px}
  .card .bottom{display:flex;justify-content:space-between;align-items:flex-end}
  .price{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .price small{font-size:12px;color:var(--txt3);font-weight:600;margin-left:3px}
  .day{font-size:12px;font-weight:600;margin-top:2px}
  .perf{
    font-size:16px;font-weight:750;font-variant-numeric:tabular-nums;
    padding:7px 13px;border-radius:var(--r-sm);
  }
  .perf.up{color:var(--up);background:rgba(48,209,88,.11)}
  .perf.down{color:var(--down);background:rgba(255,69,58,.1)}
  .up{color:var(--up)} .down{color:var(--down)}
  .card .since{font-size:11.5px;color:var(--txt3);margin-top:10px}
  .nodata{font-size:13px;color:var(--txt3);padding:18px 0 8px}

  .empty{padding:70px 0;text-align:center;color:var(--txt3);font-size:15px}

  /* ─── Modal détail ─── */
  .overlay{
    position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 18px 40px;overflow-y:auto;overscroll-behavior:contain;
    background:rgba(5,6,9,.6);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{
    width:100%;max-width:760px;background:rgba(22,24,31,.86);border:1px solid var(--stroke);
    border-radius:32px;padding:30px 32px 34px;position:relative;
    transform:translateY(26px) scale(.97);transition:transform .42s cubic-bezier(.2,.9,.25,1.05);
    box-shadow:0 40px 90px -20px rgba(0,0,0,.8);
  }
  .overlay.show .sheet{transform:none}
  .sheet::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;border-radius:32px 32px 0 0;opacity:.9;
    background:linear-gradient(90deg,transparent,var(--tint,#666),transparent)}
  .sheet.p-ap{--tint:var(--ap)} .sheet.p-sa{--tint:var(--sa)} .sheet.p-vl{--tint:var(--vl)}
  .close{
    position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.08);color:var(--txt2);font-size:15px;display:flex;align-items:center;justify-content:center;
    transition:background .2s;
  }
  .close:hover{background:rgba(255,255,255,.16);color:#fff}
  .m-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:12px;padding-right:44px}
  .m-head .cname{font-size:26px;margin-top:2px}
  .m-sector{font-size:12.5px;color:var(--txt2);margin-top:6px}
  .m-priceline{display:flex;align-items:baseline;flex-wrap:wrap;gap:14px;margin:20px 0 4px}
  .m-price{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .m-price small{font-size:17px;color:var(--txt3);font-weight:600}
  .m-day{font-size:14px;font-weight:650}
  .m-perfline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .m-perfline .perf{font-size:18px}
  .m-perfline .picked{font-size:12.5px;color:var(--txt3)}
  .chartbox{position:relative;margin:6px -6px 6px}
  .chartbox svg{display:block;width:100%;height:250px}
  .tip{
    position:absolute;pointer-events:none;opacity:0;transition:opacity .15s;
    background:rgba(10,11,15,.92);border:1px solid var(--stroke);border-radius:11px;
    padding:8px 11px;font-size:12px;line-height:1.55;white-space:nowrap;transform:translate(-50%,-115%);
    backdrop-filter:blur(10px);z-index:5;
  }
  .tip b{font-variant-numeric:tabular-nums}
  .m-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:20px 0}
  .ms{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
    border-radius:16px;padding:13px 15px;
  }
  .ms .l{font-size:10.5px;color:var(--txt3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .ms .v{font-size:17px;font-weight:700;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .ms .s{font-size:11px;color:var(--txt3);margin-top:2px}
  .range{margin:22px 0 4px}
  .range .l{font-size:10.5px;color:var(--txt3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:9px}
  .rbar{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,69,58,.5),rgba(255,214,10,.45),rgba(48,209,88,.55))}
  .rdot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid #10131a;transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(255,255,255,.45)}
  .rlbls{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt2);margin-top:8px;font-variant-numeric:tabular-nums}
  .desc{margin-top:22px}
  .desc .l{font-size:10.5px;color:var(--txt3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
  .desc p{font-size:14.5px;line-height:1.65;color:#d8dae2}
  .desc details{margin-top:10px}
  .desc summary{font-size:12px;color:var(--txt3);cursor:pointer;user-select:none}
  .desc details p{font-size:13px;color:var(--txt2);margin-top:8px}
  .m-links{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
  .m-links a{
    font-size:13px;font-weight:600;color:var(--txt);text-decoration:none;
    padding:10px 18px;border-radius:100px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);
    transition:background .2s;
  }
  .m-links a:hover{background:rgba(255,255,255,.13)}
  .m-links a.primary{background:color-mix(in srgb,var(--tint) 22%,transparent);border-color:color-mix(in srgb,var(--tint) 45%,transparent)}

  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ─── Mode live ─── */
  .hright{position:relative;display:flex;align-items:center;gap:10px}
  .gear{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--stroke);cursor:pointer;
    background:var(--card);color:var(--txt2);font-size:16px;line-height:1;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .2s;
  }
  .gear:hover{background:rgba(255,255,255,.12);color:#fff}
  .live-dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);
    margin-right:5px;vertical-align:1px;animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(48,209,88,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(48,209,88,0)}}
  .pop{
    position:absolute;top:calc(100% + 12px);right:0;z-index:60;width:290px;
    background:rgba(24,26,33,.95);border:1px solid var(--stroke);border-radius:20px;padding:18px;
    backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    box-shadow:0 24px 60px -12px rgba(0,0,0,.7);
    display:none;
  }
  .pop.show{display:block;animation:rise .3s cubic-bezier(.2,.8,.25,1)}
  .pop .l{font-size:10.5px;color:var(--txt3);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .pop input{
    width:100%;border:1px solid var(--stroke);background:rgba(255,255,255,.05);border-radius:11px;
    color:var(--txt);font-family:inherit;font-size:13px;padding:10px 12px;outline:0;margin-bottom:9px;
  }
  .pop input:focus{border-color:rgba(10,132,255,.55)}
  .pop button{
    width:100%;border:0;border-radius:11px;padding:10px;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:700;color:#fff;margin-bottom:7px;
    background:linear-gradient(135deg,rgba(10,132,255,.9),rgba(10,132,255,.6));
  }
  .pop button.ghost{background:rgba(255,255,255,.07);color:var(--txt2);font-weight:600}
  .pop p{font-size:11.5px;line-height:1.55;color:var(--txt3);margin-top:4px}
  .card.flash{animation:flash 1s ease-out}
  @keyframes flash{0%{border-color:rgba(48,209,88,.55);box-shadow:0 0 22px -4px rgba(48,209,88,.35)}100%{border-color:var(--stroke)}}

  @media(max-width:820px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat .val{font-size:24px}
    .sheet{padding:24px 20px 28px;border-radius:26px}
    .m-price{font-size:32px}
  }
  @media(max-width:560px){
    .grid{grid-template-columns:1fr}
    .seg{overflow-x:auto;max-width:100%}
    header{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<div class="wrap">
  <header>
    <div class="logo"><h1>KPITALIST</h1><span>Suivi des recommandations</span></div>
    <div class="hright">
      <div class="updated" id="updated"></div>
      <button class="gear" id="gearBtn" title="Réglages du mode live">⚙︎</button>
      <div class="pop" id="pop">
        <div class="l">Cours en direct (Finnhub)</div>
        <input id="fhInput" type="password" placeholder="Colle ta clé API Finnhub…" autocomplete="off">
        <button id="fhSave">Activer le live</button>
        <button id="fhClear" class="ghost">Désactiver</button>
        <p>Clé gratuite sur <b>finnhub.io</b>. Quand l'app est ouverte, les cours US se rafraîchissent en continu (tour complet ≈ 1 min). La clé reste stockée sur cet appareil uniquement.</p>
      </div>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <div class="controls">
    <div class="seg" id="seg">
      <button data-pf="ALL" class="on">Tout</button>
      <button data-pf="ALPHA PICK" class="c-ap">Alpha Pick</button>
      <button data-pf="STOCK ADVISOR" class="c-sa">Stock Advisor</button>
      <button data-pf="VALUE LINE" class="c-vl">Value Line</button>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#fff" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="text" placeholder="Rechercher une action, un ticker…">
    </div>
    <select class="sort" id="sort">
      <option value="perf-desc">Perf. ↓</option>
      <option value="perf-asc">Perf. ↑</option>
      <option value="date-desc">Plus récentes</option>
      <option value="date-asc">Plus anciennes</option>
      <option value="name">Nom A→Z</option>
      <option value="pe">PER croissant</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">Aucune action ne correspond à la recherche.</div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="data/stocks.js"></script>
<script src="data/live_config.js" onerror="/* absent sur GitHub Pages : clé via le panneau ⚙︎ */"></script>
<script>
"use strict";
const DATA = window.KPITALIST_DATA || {picks:[],quotes:{},generatedAt:"?"};
const Q = DATA.quotes;
const PF_CLASS = {"ALPHA PICK":"p-ap","STOCK ADVISOR":"p-sa","VALUE LINE":"p-vl"};
const PF_SHORT = {"ALPHA PICK":"Alpha Pick","STOCK ADVISOR":"Stock Advisor","VALUE LINE":"Value Line"};
const CUR = {USD:"$",EUR:"€",CAD:"$ CA",GBp:"p"};

const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"});
const fmtPrice = (v,cur)=> v==null ? "—" : v.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2});
const curSym = c => CUR[c]||c||"";
const fmtPct = v => v==null ? "—" : (v>0?"+":"")+v.toFixed(1).replace(".",",")+" %";
const fmtBig = v =>{
  if(v==null) return "—";
  if(v>=1e12) return (v/1e12).toFixed(2).replace(".",",")+" T";
  if(v>=1e9)  return (v/1e9).toFixed(1).replace(".",",")+" Md";
  if(v>=1e6)  return (v/1e6).toFixed(1).replace(".",",")+" M";
  if(v>=1e3)  return (v/1e3).toFixed(0)+" k";
  return String(v);
};
const fmtNum = v => v==null ? "—" : v.toFixed(1).replace(".",",");

/* série depuis la date du pick */
function seriesSince(pick){
  const q = Q[pick.ticker]; if(!q||!q.history) return null;
  const {dates,closes} = q.history;
  const out = {d:[],c:[]};
  for(let i=0;i<dates.length;i++){ if(dates[i]>=pick.date){ out.d.push(dates[i]); out.c.push(closes[i]); } }
  if(out.c.length<2 && closes.length){ // pick trop récent : garder les derniers points
    const n = Math.min(closes.length, 10);
    out.d = dates.slice(-n); out.c = closes.slice(-n);
  }
  return out.c.length ? out : null;
}
const perfOf = p =>{
  const q = Q[p.ticker];
  return (q && q.price!=null && p.priceAtPick) ? (q.price/p.priceAtPick-1)*100 : null;
};
const dayChg = q => (q && q.price!=null && q.prevClose) ? (q.price/q.prevClose-1)*100 : null;

/* ─── Sparkline SVG ─── */
function sparkSVG(s, positive, W=300, H=56){
  const min=Math.min(...s.c), max=Math.max(...s.c), span=(max-min)||1;
  const X=i=> (i/(s.c.length-1))*W, Y=v=> 5+(H-10)*(1-(v-min)/span);
  let path="M"+X(0).toFixed(1)+" "+Y(s.c[0]).toFixed(1);
  for(let i=1;i<s.c.length;i++) path+=" L"+X(i).toFixed(1)+" "+Y(s.c[i]).toFixed(1);
  const col = positive ? "var(--up)" : "var(--down)";
  const gid = "g"+Math.random().toString(36).slice(2,8);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${positive?'#30d158':'#ff453a'}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${positive?'#30d158':'#ff453a'}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${path} L${W} ${H} L0 ${H} Z" fill="url(#${gid})" stroke="none"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

/* ─── Stats globales ─── */
function renderStats(){
  const perfs = DATA.picks.map(p=>({p,v:perfOf(p)})).filter(x=>x.v!=null);
  const avg = perfs.reduce((a,x)=>a+x.v,0)/(perfs.length||1);
  const winners = perfs.filter(x=>x.v>0).length;
  const best = perfs.slice().sort((a,b)=>b.v-a.v)[0];
  const el = document.getElementById("stats");
  el.innerHTML = `
    <div class="stat"><div class="lbl">Recommandations</div><div class="val">${DATA.picks.length}</div>
      <div class="sub">depuis ${fmtDate(DATA.picks.reduce((a,p)=>p.date<a?p.date:a,DATA.picks[0].date))}</div></div>
    <div class="stat"><div class="lbl">Perf. moyenne</div><div class="val ${avg>=0?'up':'down'}">${fmtPct(avg)}</div>
      <div class="sub">depuis chaque reco</div></div>
    <div class="stat"><div class="lbl">Taux de réussite</div><div class="val">${Math.round(winners/perfs.length*100)} %</div>
      <div class="sub">${winners} gagnantes / ${perfs.length}</div></div>
    <div class="stat"><div class="lbl">Meilleur pick</div><div class="val up">${best?fmtPct(best.v):"—"}</div>
      <div class="sub">${best?best.p.name+" ("+(Q[best.p.ticker]?.symbol||best.p.ticker)+")":""}</div></div>`;
}

/* ─── Grille ─── */
let state = {pf:"ALL", q:"", sort:"perf-desc"};

function visiblePicks(){
  let list = DATA.picks.slice();
  if(state.pf!=="ALL") list = list.filter(p=>p.portfolio===state.pf);
  if(state.q){
    const s = state.q.toLowerCase();
    list = list.filter(p=> p.name.toLowerCase().includes(s) || p.ticker.toLowerCase().includes(s)
      || (Q[p.ticker]?.symbol||"").toLowerCase().includes(s));
  }
  const by = {
    "perf-desc":(a,b)=>(perfOf(b)??-1e9)-(perfOf(a)??-1e9),
    "perf-asc": (a,b)=>(perfOf(a)?? 1e9)-(perfOf(b)?? 1e9),
    "date-desc":(a,b)=>b.date.localeCompare(a.date),
    "date-asc": (a,b)=>a.date.localeCompare(b.date),
    "name":     (a,b)=>a.name.localeCompare(b.name,"fr"),
    "pe":       (a,b)=>((Q[a.ticker]?.pe)??1e9)-((Q[b.ticker]?.pe)??1e9),
  };
  return list.sort(by[state.sort]||by["perf-desc"]);
}

function renderGrid(){
  const grid = document.getElementById("grid");
  const list = visiblePicks();
  document.getElementById("empty").style.display = list.length ? "none":"block";
  grid.innerHTML = list.map((p,i)=>{
    const q = Q[p.ticker];
    const perf = perfOf(p), day = dayChg(q);
    const s = seriesSince(p);
    return `<div class="card ${PF_CLASS[p.portfolio]||''}" data-id="${p.id}" style="animation-delay:${Math.min(i*35,420)}ms">
      <div class="top">
        <div>
          <div class="tkr">${q?.symbol||p.ticker}</div>
          <div class="cname">${p.name}</div>
        </div>
        <div class="pf-badge">${PF_SHORT[p.portfolio]||p.portfolio}</div>
      </div>
      ${ s ? sparkSVG(s, (perf??0)>=0) : `<div class="nodata">Données indisponibles</div>` }
      <div class="bottom">
        <div>
          <div class="price">${fmtPrice(q?.price)}<small>${curSym(q?.currency)}</small></div>
          <div class="day ${day>=0?'up':'down'}">${day!=null?fmtPct(day)+" auj.":""}</div>
        </div>
        <div class="perf ${(perf??0)>=0?'up':'down'}">${fmtPct(perf)}</div>
      </div>
      <div class="since">Reco le ${fmtDate(p.date)} · ${p.priceAtPick?fmtPrice(p.priceAtPick)+" "+curSym(q?.currency)+" au pick":""}</div>
    </div>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openDetail(+c.dataset.id)));
}

/* ─── Détail ─── */
const overlay = document.getElementById("overlay"), sheet = document.getElementById("sheet");

function bigChart(s, pickPrice, cur){
  const W=700, H=250, P={t:14,r:10,b:26,l:46};
  const min0=Math.min(...s.c, pickPrice||Infinity), max0=Math.max(...s.c, pickPrice||-Infinity);
  const pad=(max0-min0)*0.07||1, min=min0-pad, max=max0+pad, span=max-min;
  const X=i=> P.l+(i/(s.c.length-1))*(W-P.l-P.r);
  const Y=v=> P.t+(H-P.t-P.b)*(1-(v-min)/span);
  let path="M"+X(0).toFixed(1)+" "+Y(s.c[0]).toFixed(1);
  for(let i=1;i<s.c.length;i++) path+=" L"+X(i).toFixed(1)+" "+Y(s.c[i]).toFixed(1);
  const pos = s.c[s.c.length-1] >= (pickPrice ?? s.c[0]);
  const col = pos ? "#30d158" : "#ff453a";
  // grille horizontale : 4 niveaux
  let gridLines="", lbls="";
  for(let k=0;k<=3;k++){
    const v = min + span*k/3, y = Y(v);
    gridLines += `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    lbls += `<text x="${P.l-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#5c6170" font-family="inherit">${v.toFixed(v>200?0:1)}</text>`;
  }
  // repères de dates (début / milieu / fin)
  const di=[0, Math.floor((s.d.length-1)/2), s.d.length-1];
  const dlbl = di.map(i=>`<text x="${X(i)}" y="${H-8}" text-anchor="${i===0?'start':i===s.d.length-1?'end':'middle'}" font-size="10.5" fill="#5c6170">${fmtDate(s.d[i])}</text>`).join("");
  const pickLine = pickPrice ? `<line x1="${P.l}" y1="${Y(pickPrice)}" x2="${W-P.r}" y2="${Y(pickPrice)}" stroke="rgba(255,255,255,.35)" stroke-width="1" stroke-dasharray="3 5"/>
    <text x="${W-P.r}" y="${Y(pickPrice)-6}" text-anchor="end" font-size="10.5" fill="#9a9fac">reco ${fmtPrice(pickPrice)} ${curSym(cur)}</text>` : "";
  return {svg:`<svg viewBox="0 0 ${W} ${H}" id="bigchart">
    <defs><linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${col}" stop-opacity=".22"/><stop offset="100%" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}${lbls}${dlbl}${pickLine}
    <path d="${path} L${X(s.c.length-1)} ${H-P.b} L${P.l} ${H-P.b} Z" fill="url(#bg-grad)"/>
    <path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle id="hoverdot" r="4.5" fill="${col}" stroke="#0b0d12" stroke-width="2.5" opacity="0"/>
  </svg>`, X, Y, W, H};
}

function openDetail(id){
  const p = DATA.picks.find(x=>x.id===id); if(!p) return;
  const q = Q[p.ticker]||{};
  const perf = perfOf(p), day = dayChg(q);
  const s = seriesSince(p);
  const cur = q.currency;
  const ch = s ? bigChart(s, p.priceAtPick, cur) : null;
  const pos52 = (q.low52!=null&&q.high52!=null&&q.price!=null&&q.high52>q.low52)
      ? Math.min(100,Math.max(0,(q.price-q.low52)/(q.high52-q.low52)*100)) : null;
  const gLink = `https://www.google.com/finance/quote/${encodeURIComponent((q.symbol||p.ticker).replace("-","."))}`;
  sheet.className = "sheet "+(PF_CLASS[p.portfolio]||"");
  sheet.dataset.ticker = p.ticker;
  sheet.dataset.pickId = p.id;
  sheet.innerHTML = `
    <button class="close" id="mclose">✕</button>
    <div class="m-head">
      <div>
        <div class="tkr">${q.symbol||p.ticker} · ${q.exchange||""}</div>
        <div class="cname">${p.name}</div>
        <div class="m-sector">${[q.sector,q.industry].filter(Boolean).join(" · ")||""}</div>
      </div>
      <div class="pf-badge">${PF_SHORT[p.portfolio]||p.portfolio}</div>
    </div>
    <div class="m-priceline">
      <div class="m-price">${fmtPrice(q.price)}<small> ${curSym(cur)}</small></div>
      <div class="m-day ${day>=0?'up':'down'}">${day!=null?fmtPct(day)+" aujourd'hui":""}</div>
    </div>
    <div class="m-perfline">
      <div class="perf ${(perf??0)>=0?'up':'down'}">${fmtPct(perf)} depuis la reco</div>
      <div class="picked">recommandée le ${fmtDate(p.date)} ${p.priceAtPick?"à "+fmtPrice(p.priceAtPick)+" "+curSym(cur):""}</div>
    </div>
    ${ch?`<div class="chartbox" id="chartbox">${ch.svg}<div class="tip" id="tip"></div></div>`:`<div class="nodata">Historique indisponible pour ce titre.</div>`}
    <div class="m-stats">
      <div class="ms"><div class="l">PER</div><div class="v">${fmtNum(q.pe)}</div><div class="s">12 mois glissants</div></div>
      <div class="ms"><div class="l">PER prévisionnel</div><div class="v">${fmtNum(q.forwardPe)}</div><div class="s">estimations</div></div>
      <div class="ms"><div class="l">Volume (jour)</div><div class="v">${fmtBig(q.volume)}</div><div class="s">titres échangés</div></div>
      <div class="ms"><div class="l">Volume moyen</div><div class="v">${fmtBig(q.avgVolume)}</div><div class="s">3 derniers mois</div></div>
      <div class="ms"><div class="l">Capitalisation</div><div class="v">${fmtBig(q.marketCap)}<small style="font-size:12px;color:var(--txt3)"> ${curSym(cur)}</small></div><div class="s">boursière</div></div>
      <div class="ms"><div class="l">BPA</div><div class="v">${q.eps!=null?fmtNum(q.eps):"—"}</div><div class="s">bénéfice par action</div></div>
    </div>
    ${pos52!=null?`
    <div class="range">
      <div class="l">Plage 52 semaines</div>
      <div class="rbar"><div class="rdot" style="left:${pos52.toFixed(1)}%"></div></div>
      <div class="rlbls"><span>${fmtPrice(q.low52)} ${curSym(cur)}</span><span>${fmtPrice(q.high52)} ${curSym(cur)}</span></div>
    </div>`:""}
    <div class="desc">
      <div class="l">Activité</div>
      <p>${q.descFr||"Description indisponible."}</p>
      ${q.descEn?`<details><summary>Description complète (EN)</summary><p>${q.descEn}…</p></details>`:""}
    </div>
    <div class="m-links">
      <a class="primary" href="${gLink}" target="_blank" rel="noopener">Google Finance ↗</a>
      ${q.website?`<a href="${q.website}" target="_blank" rel="noopener">Site officiel ↗</a>`:""}
    </div>`;
  overlay.classList.add("show");
  document.body.style.overflow="hidden";
  document.getElementById("mclose").addEventListener("click",closeDetail);
  if(ch) hookChart(s, ch, p, cur);
}
function closeDetail(){ overlay.classList.remove("show"); document.body.style.overflow=""; }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeDetail(); });
window.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDetail(); });

function hookChart(s, ch, p, cur){
  const box = document.getElementById("chartbox");
  const svg = document.getElementById("bigchart");
  const dot = svg.querySelector("#hoverdot");
  const tip = document.getElementById("tip");
  const move = ev =>{
    const r = svg.getBoundingClientRect();
    const cx = (ev.touches?ev.touches[0].clientX:ev.clientX);
    const xSvg = (cx-r.left)/r.width*ch.W;
    let i = Math.round((xSvg-46)/(ch.W-46-10)*(s.c.length-1));
    i = Math.max(0,Math.min(s.c.length-1,i));
    const px = ch.X(i)/ch.W*r.width, py = ch.Y(s.c[i])/ch.H*r.height;
    dot.setAttribute("cx",ch.X(i)); dot.setAttribute("cy",ch.Y(s.c[i])); dot.setAttribute("opacity","1");
    const pf = p.priceAtPick ? (s.c[i]/p.priceAtPick-1)*100 : null;
    tip.style.left=px+"px"; tip.style.top=py+"px"; tip.style.opacity="1";
    tip.innerHTML = `${fmtDate(s.d[i])}<br><b>${fmtPrice(s.c[i])} ${curSym(cur)}</b>${pf!=null?` · <b class="${pf>=0?'up':'down'}">${fmtPct(pf)}</b>`:""}`;
  };
  const leave = ()=>{ dot.setAttribute("opacity","0"); tip.style.opacity="0"; };
  box.addEventListener("mousemove",move); box.addEventListener("touchmove",move,{passive:true});
  box.addEventListener("mouseleave",leave); box.addEventListener("touchend",leave);
}

/* ─── Événements ─── */
document.getElementById("seg").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#seg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  state.pf = b.dataset.pf;
  renderGrid();
});
document.getElementById("search").addEventListener("input",e=>{ state.q=e.target.value.trim(); renderGrid(); });
document.getElementById("sort").addEventListener("change",e=>{ state.sort=e.target.value; renderGrid(); });

/* ─── Mode live (Finnhub, gratuit : ~55 req/min) ─── */
const FH_MAP = {"BRK-B":"BRK.B","MOG-A":"MOG.A"};          // notation Finnhub
const FH_SKIP = new Set(["PRY.MI","ATZ.TO"]);              // hors US : pas couvert en gratuit
let liveIdx = 0, liveOrder = [], liveOk = false;

function fhKey(){
  return localStorage.getItem("finnhubKey") || window.FINNHUB_KEY || "";
}
function renderUpdated(){
  const live = fhKey() && liveOk;
  document.getElementById("updated").innerHTML =
    (live ? `<span class="live-dot"></span><b>Live</b> · ` : ``) +
    `Données Yahoo Finance<br>maj <b>${DATA.generatedAt}</b>`;
}

async function liveTick(){
  const key = fhKey();
  if(!key || document.hidden) return;
  if(!liveOrder.length)
    liveOrder = [...new Set(DATA.picks.map(p=>p.ticker))].filter(t=>!FH_SKIP.has(t) && Q[t]);
  const t = liveOrder[liveIdx % liveOrder.length];
  liveIdx++;
  try{
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(FH_MAP[t]||t)}&token=${key}`);
    if(!r.ok){ if(r.status===401){ liveOk=false; renderUpdated(); } return; }
    const j = await r.json();
    if(!j || !j.c) return;
    if(!liveOk){ liveOk = true; renderUpdated(); }
    const q = Q[t];
    const changed = q.price !== j.c;
    q.price = j.c;
    if(j.pc) q.prevClose = j.pc;
    const today = new Date().toISOString().slice(0,10);
    const h = q.history;
    if(h && h.dates.length){
      if(h.dates[h.dates.length-1] === today) h.closes[h.closes.length-1] = j.c;
      else { h.dates.push(today); h.closes.push(j.c); }
    }
    if(changed) patchTicker(t);
    if(liveIdx % liveOrder.length === 0) renderStats();   // stats globales à chaque tour complet
  }catch(e){ /* réseau : on retentera au tick suivant */ }
}

function patchTicker(t){
  const q = Q[t];
  DATA.picks.filter(p=>p.ticker===t).forEach(p=>{
    const card = document.querySelector(`.card[data-id="${p.id}"]`);
    if(!card) return;
    const perf = perfOf(p), day = dayChg(q);
    card.querySelector(".price").innerHTML = fmtPrice(q.price)+`<small>${curSym(q.currency)}</small>`;
    const dEl = card.querySelector(".day");
    dEl.className = "day "+((day??0)>=0?"up":"down");
    dEl.textContent = day!=null ? fmtPct(day)+" auj." : "";
    const pEl = card.querySelector(".perf");
    pEl.className = "perf "+((perf??0)>=0?"up":"down");
    pEl.textContent = fmtPct(perf);
    const s = seriesSince(p), old = card.querySelector(".spark");
    if(s && old) old.outerHTML = sparkSVG(s, (perf??0)>=0);
    card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
  });
  // fiche ouverte sur ce titre → maj des chiffres (sans redessiner la courbe sous la souris)
  if(overlay.classList.contains("show") && sheet.dataset.ticker===t){
    const p = DATA.picks.find(x=>x.id===+sheet.dataset.pickId);
    if(!p) return;
    const perf = perfOf(p), day = dayChg(q);
    const mp = sheet.querySelector(".m-price");
    if(mp) mp.innerHTML = fmtPrice(q.price)+`<small> ${curSym(q.currency)}</small>`;
    const md = sheet.querySelector(".m-day");
    if(md){ md.className="m-day "+((day??0)>=0?"up":"down"); md.textContent = day!=null?fmtPct(day)+" aujourd'hui":""; }
    const mpf = sheet.querySelector(".m-perfline .perf");
    if(mpf){ mpf.className="perf "+((perf??0)>=0?"up":"down"); mpf.textContent = fmtPct(perf)+" depuis la reco"; }
  }
}
setInterval(liveTick, 1100);   // ≈55 req/min, sous la limite gratuite de 60

/* panneau réglages */
const pop = document.getElementById("pop");
document.getElementById("gearBtn").addEventListener("click",e=>{
  e.stopPropagation(); pop.classList.toggle("show");
  document.getElementById("fhInput").value = localStorage.getItem("finnhubKey")||"";
});
document.addEventListener("click",e=>{ if(!pop.contains(e.target) && e.target.id!=="gearBtn") pop.classList.remove("show"); });
document.getElementById("fhSave").addEventListener("click",()=>{
  const v = document.getElementById("fhInput").value.trim();
  if(v){ localStorage.setItem("finnhubKey", v); liveOk=false; liveTick(); }
  pop.classList.remove("show"); renderUpdated();
});
document.getElementById("fhClear").addEventListener("click",()=>{
  localStorage.removeItem("finnhubKey"); liveOk=false;
  pop.classList.remove("show"); renderUpdated();
});

/* ─── Init ─── */
renderUpdated();
renderStats();
renderGrid();
liveTick();
</script>
